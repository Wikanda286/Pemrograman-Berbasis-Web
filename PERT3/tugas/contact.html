<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tugas Pertemuan 3</title>
</head>
<body bgcolor="aliceblue">
    <div id="menu">
        <table width="100%" bgcolor="lightsteelblue" cellpadding="12" cellspacing="0">
            <tr>
                <td align="left"><b>Website Sayaa</b></td>
                <td align="right">
                    <a href="index.html">Home</a> &nbsp;|&nbsp;
                    <a href="gallery.html">Gallery</a> &nbsp;|&nbsp;
                    <a href="contact.html"><b>Contact</b></a>
                </td>
            </tr>
        </table>
    </div>
    <header>
        <center>
            <h1>Halaman Contact</h1>
            <p><i>Silakan tinggalkan komentar atau pesan untuk saya</i></p>
        </center>
    </header>
    <hr>
    <div id="form-pesan">
        <center>
            <h2>Kirim Pesan</h2>
            <form action="contact.html" method="get">
                <table cellpadding="6" cellspacing="0">
                    <tr>
                        <td align="left"><label for="nama"><b>Nama</b></label></td>
                    </tr>
                    <tr>
                        <td>
                            <input type="text" id="nama" name="nama" size="50" placeholder="Masukkan nama Anda" required>
                        </td>
                    </tr>
                    <tr>
                        <td align="left"><label for="email"><b>Email</b></label></td>
                    </tr>
                    <tr>
                        <td>
                            <input type="email" id="email" name="email" size="50" placeholder="Masukkan email Anda" required>
                        </td>
                    </tr>
                    <tr>
                        <td align="left"><label for="pesan"><b>Pesan</b></label></td>
                    </tr>
                    <tr>
                        <td>
                            <textarea id="pesan" name="pesan" rows="8" cols="52" placeholder="Tulis pesan atau komentar Anda di sini" required></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td align="right">
                            <input type="reset" value="Reset">
                            <input type="submit" value="Kirim">
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </div>
    <hr>
    <footer>
        <center>
            <p><small>&copy; 2026 - Muhamad Wikanda Mulyono</small></p>
        </center>
    </footer>
</body>
</html>
